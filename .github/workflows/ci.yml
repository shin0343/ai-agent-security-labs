name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff (rebuilt workbench and tests)
        run: |
          python -m ruff check agentguard/workbench tests
          python -m ruff format --check agentguard/workbench tests
      - name: Mypy
        run: python -m mypy agentguard/workbench

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: Browser workflow
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt -c constraints.txt
      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install browser engine for Playwright
        run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: frontend
      - name: Run browser workflow
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "1"
          PW_ENGINE: ${{ matrix.engine }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ matrix.engine }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
